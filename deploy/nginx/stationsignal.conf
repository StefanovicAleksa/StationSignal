# nginx site config: serves the frontend's production build and reverse-proxies the Go API
# (REST + WebSocket) under the same origin, so the browser never sees CORS or a visible port.
#
# Install as /etc/nginx/sites-available/stationsignal.conf, symlink into sites-enabled, and
# reload nginx. Update `root` below to wherever station_signal_frontend's `npm run build` output
# (dist/) is deployed on this box. REST routes are all mounted under /api by
# station_signal_api/internal/controllers/rest/api.go (see its own comment) specifically so this
# file can proxy the whole /api/ subtree unambiguously — some REST resource names (devices,
# settings) are also frontend SPA page routes, and a bare top-level path used to collide with
# them: a hard reload of /devices got proxied straight to the Go API's JSON handler instead of
# falling through to the SPA's index.html. WS routes (internal/controllers/ws/api.go) stay
# unprefixed under /ws/ — they don't collide with any SPA route.
#
# `default_server` makes this the fallback for any request nginx can't match by Host header —
# including a bare http://<box-ip>. That matters because some clients (e.g. Android browsers)
# don't reliably resolve mDNS `.local` names — they can still reach the app directly by IP, no
# config needed. Ubuntu's stock default site must be disabled (deploy/setup.sh does this) —
# nginx refuses to start with two default_server entries on the same listen address/family.
#
# server_name is stationsignal.local, resolved via avahi/mDNS (see deploy/setup.sh) — chosen
# because the substation's client fleet is statically-addressed laptops, which a DHCP-based
# DNS handoff could never reach in the first place. Since this block is default_server, the
# hostname works whether or not avahi is actually installed on a given client-facing box.

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name stationsignal.local;

    # nginx defaults to a 1MB cap on request bodies if this isn't set explicitly — silently 413s
    # anything larger. SCL structure-file uploads (see structurefiles.go) have no size limit of
    # their own on the Go side, so don't impose one here either; 0 disables the check entirely.
    client_max_body_size 0;

    root /opt/station_signal/frontend-dist;
    index index.html;

    # SPA: any path not matched below falls through to index.html for client-side routing.
    location / {
        try_files $uri $uri/ /index.html;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # Starting reporting on a real IED can legitimately take 20+ seconds (see
        # daemonclient.callTimeout) — nginx's own default proxy timeouts are 60s each and would
        # otherwise become a new, invisible cutoff the moment that Go-side timeout is raised past
        # it. Set explicitly above callTimeout, same reasoning as /ws/'s proxy_read_timeout below.
        proxy_connect_timeout 130s;
        proxy_send_timeout 130s;
        proxy_read_timeout 130s;
    }

    location /ws/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 1d;
    }
}
