# nginx site config: serves the frontend's production build and reverse-proxies the Go API
# (REST + WebSocket) under the same origin, so the browser never sees CORS or a visible port.
#
# Install as /etc/nginx/sites-available/stationsignal.conf, symlink into sites-enabled, and
# reload nginx. Update `root` below to wherever station_signal_frontend's `npm run build` output
# (dist/) is deployed on this box. Route list mirrors the API's actual registered paths in
# station_signal_api/internal/controllers/rest/api.go and internal/controllers/ws/api.go — there
# is no /api prefix today, so this proxies on the exact top-level paths instead of a prefix.
#
# `default_server` makes this the fallback for any request nginx can't match by Host header —
# including a bare http://<box-ip>. That's deliberate: the substation router's DHCP/DNS settings
# are often outside our control (client-owned network), so clients that never picked up
# stationsignal.internal via DNS can still reach the app directly by IP, no config needed.
# Ubuntu's stock default site must be disabled (deploy/setup.sh does this) — nginx refuses to
# start with two default_server entries on the same listen address/family.

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name stationsignal.internal;

    root /opt/station_signal/frontend-dist;
    index index.html;

    # SPA: any path not matched below falls through to index.html for client-side routing.
    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~ ^/(health|devices|scans|structure-files)(/|$) {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /ws/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 1d;
    }
}
