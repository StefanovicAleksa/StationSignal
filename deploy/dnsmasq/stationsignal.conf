# dnsmasq config: resolve stationsignal.internal to this box's static IP for every PC on the
# substation LAN, and forward everything else to the normal upstream DNS so clients keep
# working internet/DNS resolution for anything that isn't this box.
#
# stationsignal.internal, not stationsignal.com: .internal is reserved (RFC 9476) so it can
# never be delegated as a real public domain. An earlier revision used stationsignal.com, which
# collided with an unrelated real, live, HSTS-enabled site of the same name - any browser that
# ever touched the real site (or ships it HSTS-preloaded) silently force-upgraded every request
# to HTTPS and could never reach this box's plain-HTTP nginx, with no client-side fix available.
#
# Install as /etc/dnsmasq.d/stationsignal.conf (or /etc/NetworkManager/dnsmasq.d/ if
# NetworkManager's built-in dnsmasq is already the box's resolver — check that first, see
# deploy/README.md) and restart dnsmasq. Fill in the two placeholders below before installing.

address=/stationsignal.internal/<BOX_STATIC_IP>
server=<UPSTREAM_DNS_IP>
