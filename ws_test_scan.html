<!doctype html>
<html>
<head><meta charset="utf-8"><title>frontend prototype: scan -> click -> report</title></head>
<body style="font-family: monospace; background:#111; color:#0f0; padding:1em;">

<h2 style="margin-top:0;">Scanning (scan_dispatcher, ws://127.0.0.1:8766)</h2>
<div id="scanStatus">connecting...</div>
<div style="margin: 0.5em 0;">
  interfaceId used to start reporting: <input id="f_interfaceId" value="lo" size="10">
</div>
<div id="devices" style="margin-top:0.5em;"></div>

<h2>Now Reporting (control_dispatcher, ws://127.0.0.1:8767)</h2>
<div id="controlStatus">connecting...</div>
<div id="reporting"></div>

<script>
  const scanStatusEl = document.getElementById("scanStatus");
  const devicesEl = document.getElementById("devices");
  const controlStatusEl = document.getElementById("controlStatus");
  const reportingEl = document.getElementById("reporting");

  // key = "host:mmsPort" -> { host, mmsPort, el }
  const discovered = new Map();
  // key = "host:mmsPort" -> { deviceId, wsPort, ws, mmsCount, gooseCount, otherCount, el, ... }
  const reporting = new Map();
  let requestSeq = 0;
  // requestId -> key ("host:mmsPort") of the device that START_REPORTING was sent for
  const pendingStarts = new Map();

  function prependEntry(container, color, label, bodyText) {
    const ts = new Date().toLocaleTimeString();
    const entry = document.createElement("div");
    entry.style.borderLeft = `4px solid ${color}`;
    entry.style.margin = "0.5em 0";
    entry.style.paddingLeft = "0.5em";
    entry.innerHTML =
      `<div style="color:${color}; font-weight:bold;">[${ts}] ${label}</div>` +
      `<pre style="white-space: pre-wrap; margin: 0.2em 0;"></pre>`;
    entry.querySelector("pre").textContent = bodyText;
    container.insertBefore(entry, container.firstChild);
  }

  // ---- scan_dispatcher (8766): render discovered devices as a clickable list ----

  const scanWs = new WebSocket("ws://127.0.0.1:8766");

  scanWs.onopen = () => { scanStatusEl.textContent = "CONNECTED"; scanStatusEl.style.color = "#0f0"; };
  scanWs.onerror = () => { scanStatusEl.textContent = "ERROR"; scanStatusEl.style.color = "#f00"; };
  scanWs.onclose = () => { scanStatusEl.textContent = "CLOSED"; scanStatusEl.style.color = "#f80"; };

  scanWs.onmessage = (e) => {
    let parsed;
    try { parsed = JSON.parse(e.data); } catch (err) { return; }
    if (!parsed || parsed.type !== "SCAN_RESULT") return;

    const key = `${parsed.host}:${parsed.mmsPort}`;
    if (discovered.has(key)) return; // already listed

    const row = document.createElement("div");
    row.style.cursor = "pointer";
    row.style.padding = "0.4em 0.6em";
    row.style.margin = "0.25em 0";
    row.style.border = "1px solid #333";
    row.textContent = `${parsed.host}:${parsed.mmsPort}  (found ${new Date(parsed.discoveredAtMs).toLocaleTimeString()})`;
    row.onmouseenter = () => { row.style.background = "#222"; };
    row.onmouseleave = () => { row.style.background = ""; };
    row.onclick = () => startReporting(parsed.host, parsed.mmsPort, row);

    devicesEl.appendChild(row);
    discovered.set(key, { host: parsed.host, mmsPort: parsed.mmsPort, el: row });
  };

  // ---- control_dispatcher (8767): click a device -> START_REPORTING ----

  const controlWs = new WebSocket("ws://127.0.0.1:8767");

  controlWs.onopen = () => { controlStatusEl.textContent = "CONNECTED"; controlStatusEl.style.color = "#0f0"; };
  controlWs.onerror = () => { controlStatusEl.textContent = "ERROR"; controlStatusEl.style.color = "#f00"; };
  controlWs.onclose = () => { controlStatusEl.textContent = "CLOSED"; controlStatusEl.style.color = "#f80"; };

  controlWs.onmessage = (e) => {
    let parsed;
    try { parsed = JSON.parse(e.data); } catch (err) { return; }
    if (!parsed) return;

    const key = pendingStarts.get(parsed.requestId);
    pendingStarts.delete(parsed.requestId);

    if (parsed.action === "START_REPORTING" && key) {
      if (parsed.success && parsed.result) {
        beginStreaming(key, parsed.result.deviceId, parsed.result.wsPort);
      } else {
        const dev = discovered.get(key);
        if (dev) {
          dev.el.style.borderColor = "#f00";
          dev.el.title = parsed.error ? parsed.error.message : "start failed";
        }
      }
    }
  };

  function startReporting(host, mmsPort, rowEl) {
    const key = `${host}:${mmsPort}`;
    if (reporting.has(key)) return; // already reporting on this one

    rowEl.style.borderColor = "#0af";
    rowEl.style.opacity = "0.6";

    requestSeq += 1;
    const requestId = `req-${Date.now()}-${requestSeq}`;
    pendingStarts.set(requestId, key);

    const message = {
      requestId,
      action: "START_REPORTING",
      params: {
        host,
        mmsPort,
        iedName: null,
        interfaceId: document.getElementById("f_interfaceId").value,
        sclFilePath: null,
        acseAuthPassword: null,
        accessMode: "REPORT_ONLY",
      },
    };
    controlWs.send(JSON.stringify(message));
  }

  // ---- per-device ipc_dispatcher websocket (wsPort returned by START_REPORTING) ----

  function beginStreaming(key, deviceId, wsPort) {
    if (reporting.has(key)) return;
    const dev = discovered.get(key);
    if (dev) dev.el.style.borderColor = "#0f0";

    const container = document.createElement("div");
    container.style.margin = "0.75em 0";
    container.style.padding = "0.5em";
    container.style.border = "1px solid #333";
    container.innerHTML = `
      <div style="color:#ff0; font-weight:bold;">${key} — device ${deviceId} — ws://127.0.0.1:${wsPort}</div>
      <div class="rStatus" style="color:#0af;">connecting...</div>
      <div class="rCounts" style="color:#0af;">MMS reports: 0 | GOOSE: 0 | other: 0</div>
      <div class="rLog"></div>
    `;
    reportingEl.insertBefore(container, reportingEl.firstChild);

    const statusEl = container.querySelector(".rStatus");
    const countsEl = container.querySelector(".rCounts");
    const logEl = container.querySelector(".rLog");
    const rec = { deviceId, wsPort, ws: null, mmsCount: 0, gooseCount: 0, otherCount: 0 };
    reporting.set(key, rec);

    const ws = new WebSocket(`ws://127.0.0.1:${wsPort}`);
    rec.ws = ws;

    ws.onopen = () => { statusEl.textContent = "CONNECTED"; statusEl.style.color = "#0f0"; };
    ws.onerror = () => { statusEl.textContent = "ERROR"; statusEl.style.color = "#f00"; };
    ws.onclose = () => { statusEl.textContent = "CLOSED"; statusEl.style.color = "#f80"; };

    ws.onmessage = (e) => {
      let parsed;
      try { parsed = JSON.parse(e.data); } catch (err) { parsed = null; }

      const type = parsed && parsed.type;
      let color = "#aaa", label = "UNKNOWN MESSAGE";
      if (type === "MMS_REPORT") { color = "#0f0"; label = "MMS_REPORT"; rec.mmsCount++; }
      else if (type === "GOOSE") { color = "#0af"; label = "GOOSE"; rec.gooseCount++; }
      else { rec.otherCount++; }

      countsEl.textContent = `MMS reports: ${rec.mmsCount} | GOOSE: ${rec.gooseCount} | other: ${rec.otherCount}`;

      const pretty = parsed ? JSON.stringify(parsed, null, 2) : e.data;
      prependEntry(logEl, color, label, pretty);
    };
  }
</script>
</body>
</html>
